name: Vitrine do README

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- Tudo que vai para a branch "extras" ----------
  jogos:
    runs-on: ubuntu-latest
    steps:
      - name: Pac-Man e Breakout
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman,breakout"

      - name: Snake com IA
        uses: dahan8473/snake-and-commits@v1
        with:
          github_user: ${{ github.repository_owner }}
          output: dist/snake-ai.svg
          theme: green

      - name: Gravidade
        uses: flycran/github-gravity@v1
        with:
          username: ${{ github.repository_owner }}
          text: Davi Arakaki
          output-path: dist/gravity.svg
          background-color: "#0d1117"
          text-color: "#58a6ff"

      - name: Publicar na branch extras
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: extras
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------- Tudo que é salvo na branch main (um de cada vez) ----------
  contrib-3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-3d-contrib
          git commit -m "Update 3D contributions" || exit 0
          git pull --rebase && git push

  pet:
    needs: contrib-3d
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: prsdx/github-pet@v1
        with:
          username: ${{ github.repository_owner }}
          timezone-offset-minutes: "-180"

  bonsai:
    needs: pet
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: egorthinks/git-bonsai@v1

  atividade:
    needs: bonsai
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          MAX_LINES: 5
          COMMIT_MSG: "Update recent activity"

  retrato:
    needs: atividade
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: 0xharkirat/dither-portrait@v1
        with:
          username: ${{ github.repository_owner }}
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add portrait-dark.svg portrait-light.svg
          git commit -m "Update portrait" || exit 0
          git pull --rebase && git push

  metrics:
    needs: retrato
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verificar token
        id: check
        env:
          T: ${{ secrets.METRICS_TOKEN }}
        run: echo "ok=$([ -n "$T" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - uses: lowlighter/metrics@latest
        if: steps.check.outputs.ok == 'yes'
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          committer_branch: main
          base: header, activity, community, repositories, metadata
          config_timezone: America/Sao_Paulo
          config_display: large
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_achievements: yes
          plugin_achievements_display: compact
